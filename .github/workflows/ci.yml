name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Job 1: lint, tests, audit, data gate, model gate
  # ============================================================
  test-and-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- lint + Bandit ----
      - name: Lint with Ruff
        run: ruff check src/ tests/ scripts/

      - name: Security scan with Bandit
        run: |
          python -m bandit -r src/ -c .bandit -f json -o metrics/bandit_report.json
          python -m bandit -r src/ -c .bandit

      # ---- tests ----
      - name: Run unit tests
        run: python -m pytest -m "not integration" --ignore=tests/test_api.py --ignore=tests/test_health_states.py

      - name: Run integration tests
        run: python -m pytest -m integration --ignore=tests/test_api.py --ignore=tests/test_health_states.py

      # ---- audit dependencies ----
      - name: Generate pip-audit report
        run: python -m pip_audit -r requirements.txt -f json -o metrics/pip_audit_report.json || true

      - name: Enforce audit policy
        run: python scripts/audit_policy.py --report metrics/pip_audit_report.json

      # ---- data gate ----
      - name: Data gate (train sample)
        run: python scripts/data_gate.py --config configs/data_gate.yaml

      - name: Verify CI data integrity
        run: |
          cd ci_data
          sha256sum -c CHECKSUMS.sha256

      - name: Demo — gate must reject broken data
        run: |
          if python scripts/data_gate.py --config configs/data_gate.yaml \
               --data ci_data/train_broken.parquet --skip-checksum; then
            echo "ERROR: gate incorrectly passed broken data"
            exit 1
          else
            echo "OK: gate correctly rejected broken data"
          fi

      # ---- eval + model gate ----
      - name: Train on CI sample
        run: python -m src.train --artifacts ci_data --seed 42

      - name: Evaluate on CI test
        run: python -m src.ci_eval --artifacts ci_data --data ci_data/test.parquet --out metrics/ci_metrics.json

      - name: Evaluate candidate on fixed test
        run: python scripts/eval_candidate.py --policy configs/regression_policy.yaml

      - name: Compare candidate vs baseline (model gate)
        run: python scripts/compare_models.py --policy configs/regression_policy.yaml

      - name: Demo — regression gate rejects weak candidate
        run: |
          python scripts/make_weak_candidate.py --policy configs/regression_policy.yaml
          if python scripts/compare_models.py --policy configs/regression_policy.yaml \
               --candidate metrics/candidate_weak.json --out metrics/comparison_weak.json; then
            echo "ERROR: weak candidate incorrectly passed"
            exit 1
          else
            echo "OK: weak candidate correctly rejected"
          fi

      # ---- сохранить commit и SHA256 модели (всегда) ----
      - name: Save commit and model hashes
        if: always()
        run: |
          mkdir -p artifacts
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "branch=${GITHUB_REF_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "actor=${GITHUB_ACTOR}"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/ci_commit.txt
          sha256sum models/*.joblib > artifacts/model_sha256.txt 2>/dev/null || true
          cat artifacts/ci_commit.txt
          cat artifacts/model_sha256.txt

      # ---- upload отчётов (всегда, даже при падении) ----
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ github.run_id }}
          path: |
            artifacts/ci_commit.txt
            artifacts/model_sha256.txt
            metrics/bandit_report.json
            metrics/pip_audit_report.json
            metrics/ci_metrics.json
            metrics/candidate.json
            metrics/candidate_weak.json
            metrics/comparison.json
            metrics/comparison_weak.json
            metrics/baseline.json
            ci_data/lab2_span_tfidf.joblib
            ci_data/lab2_span_logreg.joblib
          if-no-files-found: warn

  # ============================================================
  # Job 2: Docker build, scan, smoke — только после test-and-eval
  # ============================================================
  docker:
    runs-on: ubuntu-24.04
    needs: test-and-eval
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t ml-project:lab3 .

      - name: UID inside container must be non-root
        run: |
          uid=$(docker run --rm --entrypoint id ml-project:lab3 -u)
          echo "UID inside container: $uid"
          test "$uid" != "0"

      - name: Model integrity inside image
        run: docker run --rm --entrypoint sh ml-project:lab3 -c "cd /app/models && sha256sum -c SHA256SUMS"

      - name: Smoke — container predicts
        run: |
          docker run --rm ml-project:lab3 "ivan.petrov@example.com" "+7 900 123-45-678" | tee /tmp/pred.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/pred.json"))
          assert isinstance(d, list) and d, "empty prediction"
          assert "label" in d[0] and "confidence" in d[0]
          assert d[0]["confidence"] > 0
          print("smoke OK:", d[0])
          PY

      - name: Trivy image scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ml-project:lab3
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          version: "v0.74.0"
          format: json
          output: metrics/trivy_image_${{ github.run_id }}.json

      - name: Trivy config scan (Dockerfile gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          exit-code: "1"
          version: "v0.74.0"
          format: json
          output: metrics/trivy_config_${{ github.run_id }}.json

      - name: Upload Trivy + docker reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-reports-${{ github.run_id }}
          path: |
            metrics/trivy_image_*.json
            metrics/trivy_config_*.json
          if-no-files-found: warn
  api:
    runs-on: ubuntu-24.04
    needs: test-and-eval
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install runtime + api deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt

      - name: Import app
        run: python -c "import sys; sys.path.insert(0,'.'); from app.app import app; print('import OK')"

      - name: API tests
        env:
          MODELS_DIR: models
        run: python -m pytest tests/test_api.py -q

      - name: Smoke via uvicorn
        env:
          API_TOKEN: ci-smoke-token
          MODELS_DIR: models
          RATE_LIMIT_MAX: "1000"
        run: |
          uvicorn app.app:app --host 127.0.0.1 --port 8000 >/tmp/uvicorn.log 2>&1 &
          UV_PID=$!
          sleep 5
          curl -fsS http://127.0.0.1:8000/health -o /tmp/health.json
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H 'content-type: application/json' \
            -H 'X-API-Key: ci-smoke-token' \
            -H 'X-Request-ID: ci-smoke-001' \
            -d '{"spans":["ivan.petrov@example.com"]}' -o /tmp/pred.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/predict \
            -H 'content-type: application/json' -d '{"spans":["a@b.com"]}')
          test "$code" = "401"
          python - <<'PY'
          import json
          h = json.load(open("/tmp/health.json"))
          p = json.load(open("/tmp/pred.json"))
          assert h["status"] == "healthy", h
          assert h.get("model_version"), h
          assert p["request_id"] == "ci-smoke-001", p
          assert p["predictions"][0]["label"], p
          print("api smoke OK (auth + predict):", p["predictions"][0])
          PY
          kill "$UV_PID" || true
