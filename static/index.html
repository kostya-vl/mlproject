<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PII span predictor — demo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>PII span predictor — demo</h1>
    <p class="hint">
      Токен вводится вручную и хранится только в памяти вкладки.
      Он не встраивается в HTML/JS, не пишется в <code>localStorage</code>
      и не передаётся в URL.
    </p>

    <form id="form" autocomplete="off">
      <label for="tok">API token</label>
      <input id="tok" name="tok" type="password" autocomplete="off" required>

      <label for="spans">Spans (по одному на строку, 1–1000)</label>
      <textarea id="spans" name="spans" rows="8" cols="60" required>ivan.petrov@example.com
+7 900 123-45-678</textarea>

      <button id="submit" type="submit">Predict</button>
    </form>

    <section id="status" role="status" aria-live="polite" hidden></section>
    <pre id="out" aria-live="polite"></pre>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
