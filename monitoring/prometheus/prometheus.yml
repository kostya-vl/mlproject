global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: predictor
    static_configs:
      # host.docker.internal — uvicorn на хосте (Linux: extra_hosts в compose)
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
    # защита /metrics Bearer-токеном (METRICS_TOKEN на сервисе)
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
