services:
  predictor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ml-project:lab4
    container_name: predictor-api
    ports:
      # публикация только на loopback хоста; внутри контейнера uvicorn слушает 0.0.0.0:8000
      - "127.0.0.1:8000:8000"
    env_file:
      # runtime-секреты: .env.monitoring — 600 mluser, в .gitignore
      - .env.monitoring
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env.monitoring}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in .env.monitoring}
      RATE_LIMIT_MAX: "30"
      RATE_LIMIT_WINDOW: "60"
      REQUEST_TIMEOUT_SEC: "10"
      MAX_CONCURRENT_REQUESTS: "4"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
